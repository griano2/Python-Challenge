<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDAP Group Manager</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <header>
        <h1>LDAP Group Management</h1>
    </header>

    <main>

        <!-- GROUP 1 -->

        <div class="card">

            <h2>Python-Test-Group-1</h2>

            <button onclick="loadMembers('Python-Test-Group-1')">
                Refresh Members
            </button>

            <ul id="group1Members"></ul>

            <div class="action-group">
                <input
                    type="email"
                    id="group1AddEmail"
                    placeholder="Email to add"
                >

                <button
                    onclick="addUser('Python-Test-Group-1', 'group1AddEmail')">
                    Add
                </button>
            </div>

            <div class="action-group">
                <input
                    type="email"
                    id="group1RemoveEmail"
                    placeholder="Email to remove"
                >

                <button
                    class="danger"
                    onclick="removeUser('Python-Test-Group-1', 'group1RemoveEmail')">
                    Remove
                </button>
            </div>

        </div>

        <!-- GROUP 2 -->

        <div class="card">

            <h2>Python-Test-Group-2</h2>

            <button onclick="loadMembers('Python-Test-Group-2')">
                Refresh Members
            </button>

            <ul id="group2Members"></ul>

            <div class="action-group">
                <input
                    type="email"
                    id="group2AddEmail"
                    placeholder="Email to add"
                >

                <button
                    onclick="addUser('Python-Test-Group-2', 'group2AddEmail')">
                    Add
                </button>
            </div>

            <div class="action-group">
                <input
                    type="email"
                    id="group2RemoveEmail"
                    placeholder="Email to remove"
                >

                <button
                    class="danger"
                    onclick="removeUser('Python-Test-Group-2', 'group2RemoveEmail')">
                    Remove
                </button>
            </div>

        </div>

        <!-- SYNC -->

        <div class="card sync-card">

            <h2>Synchronization</h2>

            <button
                class="warning"
                onclick="syncGroups()">
                Sync Group 1 → Group 2
            </button>

        </div>

    </main>

    <script src="/static/app.js"></script>
</body>
</html>
